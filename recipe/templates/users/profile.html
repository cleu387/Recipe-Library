{% extends 'layout.html' %}
{% block title %}{{ super() }} | Profile{%  endblock %}


{% block content %}
    <div class="favourite-box">
    <h1>{{ session['username'] }}</h1>
    <h3>Favourite Recipes</h3>
    <div class="favourite-recipes">
        {% for recipe in recipes %}
                <a href="{{ url_for('recipe_bp.recipeDescription', recipe_id=recipe.id) }}" class="recipe-card">
                    <img src="{{ recipe.images[0] }}" alt="{{ recipe.name }}">
                    <div class = "ft-recipe-text-">
                        <h3>{{ recipe.name }}</h3>
                        <p>By: {{ recipe.author.name }}</p>
                        <div class="rating"></div>
                        <form method="post" action="{{ url_for('users_bp.remove_favourite', recipe_id=recipe.id) }}">
                            <button type="submit" class="delete-favourite">🗑️</button>
                        </form>
                    </div>
                </a>
            {% endfor %}
    </div>
    </div>
{% endblock %}
