
{% if reviews %}
    {% for review in reviews %}
        <div class="review">
            <strong>{{ review.user.username }}</strong>
            <span>({{ review.rating }} / 5)</span>
            <p>{{ review.review_text }}</p>
            <small>{{ review.date.date() }}</small>
        </div>
        <br>
    {% endfor %}
{% else %}
    <p>No reviews yet :(</p>
{% endif %}

{% if current_user %}
    <h2>Leave a Review:</h2>
    <form action="{{ url_for("recipe_bp.add_review", recipe_id=recipe.id) }}" method="POST">
    <label for="rating">Rating:</label>
    <select name="rating" id="rating" required>
        {% for r in range(1, 6) %}
        <option value="{{ r }}" class="search-menu">{{ r }}</option>
        {% endfor %}
    </select>
    <br>
    <label for="review_text">Review:</label><br>
    <textarea id="review_text" name="text" rows="4" cols="50" required></textarea>
    <br>
    <button type="submit" class="general-button">Submit Review</button>
</form>
{% else %}
    <p><a href="{{ url_for("authentication_bp.login") }}" class="general-button">Login to leave a review</a></p>
{% endif %}
