<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="../static/css/main.css" type="text/css">
</head>
{%  include 'navbar.html' %}
<body>
    <h1>{{ heading }} </h1>
    <h2>Number of recipes: {{ num_recipes }}</h2>
        <table class="recipe-table">
            <tr>
                <th>Recipe ID</th>
                <th>Recipe Name</th>
                <th>Recipe Author</th>
            </tr>
            {% for recipe in recipes %}
                <tr>
                    <td>{{ recipe.id }}</td>
                    <td><a href="{{ url_for('recipe_bp.recipeDescription', recipe_id=recipe.id) }}">{{ recipe.name }}</a></td>
                    <td>{{ recipe.author }}</td>
                </tr>
            {% endfor %}
        </table>
{% include "_pagination.html" with context %}

</body>
</html>
