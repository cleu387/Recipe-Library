<div class="pagination">
    {% if page > 1 %}
        <a href="{{ url_for(endpoint, page=page-1) }}">Previous</a>
    {% endif %}

    {% for p in range(1, total_pages + 1) %}
        <a href="{{ url_for(endpoint, page=p) }}" class="{% if p == page %}active{% endif %}">
            {{ p }}
        </a>
    {% endfor %}

    {% if page < total_pages %}
        <a href="{{ url_for(endpoint, page=page+1) }}">Next</a>
    {% endif %}
</div>
