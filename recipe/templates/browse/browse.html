{% extends 'layout.html' %}
{% block title %}{{ super() }} | Browse Recipe{%  endblock %}


{% block content %}
    <form method="get" action="{{ url_for('recipe_bp.browse_recipes') }}" class="search-menu">
        <label for="search-type">Search by</label>
        <select id="search-type" name="search_type">
            <option value="name" {% if search_type == 'name' %}selected{% endif %}>Recipe Name</option>
            <option value="author" {% if search_type == 'author' %}selected{% endif %}>Author</option>
            <option value="category" {% if search_type == 'category' %}selected{% endif %}>Category</option>
            <option value="id" {% if search_type == 'id' %}selected{% endif %}>Recipe ID</option>
        </select>

        <label for="search-input"></label>
        <input type="text" name="search" placeholder="Search recipes" value="{{ search_query or '' }}">
        <button type="submit" class="submit-button">Search</button>
    </form>
        <div class = "recipes-block">
            {% for recipe in recipes %}
                <a href="{{ url_for('recipe_bp.recipeDescription', recipe_id=recipe.id) }}" class="recipe-card">
                    <img src="{{ recipe.image }}" alt="{{ recipe.name }}">
                    <div class = "ft-recipe-text-">
                        {{recipe.name}}
                        <p>By: {{ recipe.author }}</p>
                        <p>{{ recipe.description }}</p>

                    </div>
                </a>
            {% endfor %}
        </div>
{% include "browse/_pagination.html" with context %}
{% endblock %}
